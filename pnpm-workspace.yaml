# Which dependency build scripts are permitted to run (pnpm 11+ blocks them by default).
allowBuilds:
  esbuild: true
  spawn-sync: true

# Patched transitive version for an open advisory, scoped to one major.
overrides:
  shell-quote@<1.11.0: ^1.11.0
  undici@>=7.0.0 <7.30.1: 7.30.1
minimumReleaseAgeExclude:
  - undici@7.30.1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Compile & Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify RSA security backport
        run: pnpm test:security

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run compile

      - name: Check compiler API compatibility
        run: pnpm run compile:compat

      - name: Build Firefox extension
        run: pnpm run build:firefox

      - name: Build extension
        run: pnpm run build
